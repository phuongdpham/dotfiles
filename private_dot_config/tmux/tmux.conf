set -g default-shell /usr/bin/fish

# 24-bit color support
# set -g default-terminal "tmux-256color"
# set -ga terminal-overrides ",xterm-256color:Tc,alacritty:Tc"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

set -g allow-passthrough on

# Vi mode
set -g mode-keys vi

# Mouse support
set -g mouse on

# Get rid of the Escape delay
set -sg escape-time 0

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"

set-option -g focus-events on
set-option -g status-position top

# Set C-a as the prefix key
set -g prefix C-a
bind C-a send-prefix
unbind C-b
bind C-p previous-window
bind C-n next-window

# Open new panes in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Prefix + m to open a small 30% terminal at the bottom
bind m split-window -v -l 30% -c "#{pane_current_path}"

# Open new windows in the current directory
bind c new-window -c "#{pane_current_path}"

# Vim-like movement commands
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using Prefix + H, J, K, L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
